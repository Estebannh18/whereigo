# ops/nagios/config/00-timeperiods.cfg
# Ventanas en las que Nagios revisa y avisa.
#
# Por qué no 24x7: cada chequeo es tráfico entrante y despierta los servicios
# gratuitos de Render. Render da 750 horas gratis al mes POR WORKSPACE, así que
# seis servicios despiertos todo el día agotan las horas en ~5 días y Render
# suspende todo hasta el mes siguiente. Por eso solo operamos en las horas en
# que trabajamos y en la fecha de la sustentación.

define timeperiod {
    timeperiod_name     whereigo-operacion
    alias               Horario de operacion de Whereigo (trabajo y demo)
    monday              18:00-22:00
    tuesday             18:00-22:00
    wednesday           18:00-22:00
    thursday            18:00-22:00
    friday              18:00-22:00
    saturday            08:00-13:00
    ; Sustentación del ciclo de vida: toda la jornada (~14,5 h por servicio).
    2026-10-20          07:30-22:00
    ; Fecha de la sustentación (cierre del Sprint 5). Ajustar si cambia.
    2026-12-11          07:00-13:00
}
