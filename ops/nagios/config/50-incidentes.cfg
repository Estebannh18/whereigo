# ops/nagios/config/50-incidentes.cfg
# Gestión de incidentes: dependencias (avisar la causa raíz, no el efecto) y
# escalamiento (si nadie lo resuelve, se entera todo el equipo).

# Si el ai-service está caído, la transacción login -> ETA también fallará.
# No se notifica el efecto: ya llegó la alerta de la causa.
define servicedependency {
    host_name                       ai-service
    service_description             Disponibilidad y modelo cargado
    dependent_host_name             gateway
    dependent_service_description   Transaccion login a ETA
    notification_failure_criteria   w,c,u
    execution_failure_criteria      n
}

define servicedependency {
    host_name                       auth-service
    service_description             Disponibilidad /health
    dependent_host_name             gateway
    dependent_service_description   Transaccion login a ETA
    notification_failure_criteria   w,c,u
    execution_failure_criteria      n
}

# Escalamiento: desde la 3.ª notificación del mismo problema (~1 hora sin
# resolver), avisar a todo el equipo cada 20 minutos.
define serviceescalation {
    hostgroup_name          presentacion,acceso,inteligencia
    service_description     *
    first_notification      3
    last_notification       0
    notification_interval   20
    contact_groups          equipo-whereigo
    escalation_options      w,c,u,r
}

define hostescalation {
    hostgroup_name          presentacion,acceso,inteligencia
    first_notification      3
    last_notification       0
    notification_interval   20
    contact_groups          equipo-whereigo
    escalation_options      d,u,r
}
