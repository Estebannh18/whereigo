# render.yaml — Blueprint de Render para el backend de Whereigo? (Fase 1).
# Al conectar este repo en https://dashboard.render.com/blueprints, Render lee
# este archivo y propone crear: 1 base de datos Postgres + 3 servicios web.
# Revisa el preview que muestra Render ANTES de confirmar (ahí puedes ajustar
# nombres/región si hace falta).
#
# Nota: la instancia y la base de datos "free" de Render se duermen tras 15 min
# de inactividad (el primer request tarda unos segundos en "despertar") y la
# base de datos gratuita expira a los 90 días. Sirve perfecto para demo/entrega
# del proyecto; para algo permanente, sube al plan pago más adelante.

databases:
  - name: whereigo-postgres
    databaseName: whereigo_auth
    user: whereigo
    plan: free

services:
  - type: web
    name: whereigo-auth-service
    env: node
    plan: free
    rootDir: services/auth-service
    buildCommand: npm ci && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health
    # Lo despliega .github/workflows/deploy.yml solo cuando CI pasa (fase Desplegar).
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      # Mismo valor que ops/monitoring/secrets/metrics_token (Prometheus).
      - key: METRICS_TOKEN
        sync: false
      # Clave del admin demo que crea el seed. Sin ella se usaría la clave por defecto del código.
      - key: DEMO_ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: whereigo-postgres
          property: connectionString
      # Aceptable para la Fase 1 (aún no hay migraciones escritas). Antes de
      # producción real, generar migraciones TypeORM y poner esto en "false".
      - key: DB_SYNCHRONIZE
        value: 'true'
      - key: BCRYPT_SALT_ROUNDS
        value: '10'
      # generateValue: Render crea un secreto aleatorio único al desplegar.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d

  - type: web
    name: whereigo-gateway
    env: node
    plan: free
    rootDir: services/gateway
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # sync: false = Render te pide llenar este valor a mano en el dashboard
      # (después de crear whereigo-auth-service, copia su URL pública aquí,
      # ej. https://whereigo-auth-service.onrender.com).
      - key: AUTH_SERVICE_URL
        sync: false
      # URL pública de whereigo-ai-service (la usa la transacción login -> ETA de Nagios).
      - key: AI_SERVICE_URL
        sync: false
      # Debe ser EXACTAMENTE el mismo valor autogenerado que JWT_ACCESS_SECRET
      # de whereigo-auth-service (cópialo del dashboard de ese servicio).
      - key: JWT_ACCESS_SECRET
        sync: false
      # Dominio de Vercel del frontend una vez desplegado, ej:
      # https://whereigo.vercel.app (sin barra final). Puedes poner varios
      # separados por coma si agregas un dominio propio después.
      - key: CORS_ORIGINS
        sync: false

  # Microservicio de IA (ETA y tarifas). Segundo servicio del ciclo de vida.
  - type: web
    name: whereigo-ai-service
    env: python
    plan: free
    rootDir: services/ai-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # En el plan gratis no hay RabbitMQ: el modelo usa congestión por defecto.
      - key: RABBITMQ_ENABLED
        value: 'false'
      - key: MODEL_VERSION
        value: tinymlp-1.1
      - key: METRICS_TOKEN
        sync: false
